<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>센텀시티역 편의점 지도 | 부산 도보권 상권 시각화</title>
  <meta name="description" content="부산 센텀시티역 도보 내 편의점 위치를 지도에 표시하는 순수 바닐라 JS 서비스입니다.">

  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 로딩 오버레이 */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 헤더 */
    #app-header {
      height: 56px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .header-logo p {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .header-badge {
      background: #334155;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .badge-count {
      font-weight: bold;
      color: #38bdf8;
    }

    /* 메인 컨테이너 */
    #app-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #sidebar {
      width: 340px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
      overflow-y: auto;
      z-index: 10;
    }

    #map-container {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 설정 섹션 (도보 속도 및 입력) */
    .filter-section {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .input-group input,
    .input-group select {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    /* 버튼 그룹 */
    .walk-filter-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .walk-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
    }

    .walk-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
      font-weight: bold;
    }

    /* 점포 리스트 */
    .store-list-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      color: #cbd5e1;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
      margin-top: 6px;
    }

    #store-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .store-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: border 0.2s;
    }

    .store-card:hover {
      border-color: #38bdf8;
    }

    .store-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .store-info {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    .walk-badge {
      background: #1e293b;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-title">🗺️ 센텀시티 편의점 지도</div>
    <div class="loading-sub">지도를 초기화하고 있습니다…</div>
  </div>

  <header id="app-header">
    <div class="header-logo">
      <h1>센텀시티 편의점 지도</h1>
      <p>부산 도보권 상권 시각화 (바닐라 JS)</p>
    </div>
    <div class="header-badge">
      <span>검색된 점포: </span>
      <span class="badge-count" id="header-store-count">0</span>개
    </div>
  </header>

  <div id="app-body">
    <aside id="sidebar">
      <!-- 10분거리 체크를 위한 기준 설정 -->
      <div class="filter-section">
        <div class="filter-label">⚙️ 도보 거리 산출 조건 입력</div>
        <div class="input-group">
          <label for="walk-speed">보행 속도 (m/분):</label>
          <input type="number" id="walk-speed" value="80" min="40" max="150" placeholder="기본 80m (성인 평균)">
        </div>
        <div class="input-group">
          <label for="search-input">점포명/주소 검색:</label>
          <input type="text" id="search-input" placeholder="예: 센텀, GS25">
        </div>
      </div>

      <!-- 도보 시간 필터 -->
      <div class="filter-section">
        <div class="filter-label">⏱️ 도보 시간 기준 선택</div>
        <div class="walk-filter-group">
          <button class="walk-btn" data-time="5">5분 이내</button>
          <button class="walk-btn active" data-time="10">10분 이내</button>
          <button class="walk-btn" data-time="15">15분 이내</button>
          <button class="walk-btn" data-time="999">전체 보기</button>
        </div>
      </div>

      <!-- 점포 목록 -->
      <div class="store-list-header">
        <span>📍 점포 목록 (거리순)</span>
        <span id="store-list-count">0개</span>
      </div>
      <div id="store-list"></div>
    </aside>

    <div id="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    // 샘플 센텀시티 편의점 데이터 (기본 탑재)
    const STORE_DATA = [
      { name: "GS25 센텀역점", brand: "GS25", lat: 35.1689, lng: 129.1318, address: "부산 해운대구 센텀남대로 35" },
      { name: "CU 센텀스퀘어점", brand: "CU", lat: 35.1698, lng: 129.1325, address: "부산 해운대구 센텀3로 26" },
      { name: "세븐일레븐 센텀타워점", brand: "7eleven", lat: 35.1675, lng: 129.1305, address: "부산 해운대구 센텀2로 19" },
      { name: "이마트24 센텀드림월드점", brand: "emart24", lat: 35.1712, lng: 129.1332, address: "부산 해운대구 센텀5로 55" },
      { name: "GS25 센텀시티몰점", brand: "GS25", lat: 35.1681, lng: 129.1298, address: "부산 해운대구 센텀4로 15" },
      { name: "CU 센텀리더스마크점", brand: "CU", lat: 35.1662, lng: 129.1341, address: "부산 해운대구 APEC로 17" }
    ];

    // 중심점 (센텀시티역)
    let centerLocation = [35.1689, 129.1318];
    let map, markersGroup;
    let currentMaxMinutes = 10;

    // 직선 거리 계산 (Haversine 공식, 단위: 미터)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
        Math.cos(φ1) * Math.cos(φ2) *
        Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    // 지도 및 데이터 렌더링
    function initMap() {
      map = L.map('map').setView(centerLocation, 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // 센텀시티역 기준점 마커
      L.marker(centerLocation).addTo(map)
        .bindPopup('<b>기준점: 센텀시티역</b>').openPopup();

      markersGroup = L.layerGroup().addTo(map);

      // 로딩 화면 제거
      document.getElementById('loading-overlay').style.opacity = '0';
      setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; }, 300);

      updateView();
    }

    // 화면 및 조건 업데이트
    function updateView() {
      markersGroup.clearLayers();

      const speed = parseFloat(document.getElementById('walk-speed').value) || 80;
      const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

      const storeListEl = document.getElementById('store-list');
      storeListEl.innerHTML = '';

      let filteredCount = 0;

      // 거리 및 시간 산출 후 정리
      const processed = STORE_DATA.map(store => {
        const dist = calculateDistance(centerLocation[0], centerLocation[1], store.lat, store.lng);
        const walkMinutes = Math.round((dist / speed) * 10) / 10;
        return { ...store, dist, walkMinutes };
      }).sort((a, b) => a.dist - b.dist);

      processed.forEach(store => {
        // 필터링 조건
        if (store.walkMinutes > currentMaxMinutes) return;
        if (searchKeyword && !store.name.toLowerCase().includes(searchKeyword) && !store.address.toLowerCase().includes(searchKeyword)) return;

        filteredCount++;

        // 지도 마커 추가
        const marker = L.marker([store.lat, store.lng]).addTo(markersGroup);
        marker.bindPopup(`<b>${store.name}</b><br>${store.address}<br>도보 ${store.walkMinutes}분 (${store.dist}m)`);

        // 사이드바 카드리스트 추가
        const card = document.createElement('div');
        card.className = 'store-card';
        card.innerHTML = `
      <div class="store-name">${store.name}</div>
      <div class="store-info">
        <span>${store.address}</span>
        <span class="walk-badge">약 ${store.walkMinutes}분 (${store.dist}m)</span>
      </div>
    `;
        card.onclick = () => {
          map.setView([store.lat, store.lng], 18);
          marker.openPopup();
        };
        storeListEl.appendChild(card);
      });

      document.getElementById('header-store-count').textContent = filteredCount;
      document.getElementById('store-list-count').textContent = `${filteredCount}개`;
    }

    // 이벤트 리스너 바인딩
    document.addEventListener('DOMContentLoaded', () => {
      initMap();

      document.getElementById('walk-speed').addEventListener('input', updateView);
      document.getElementById('search-input').addEventListener('input', updateView);

      // 시간 기준 버튼 클릭
      document.querySelectorAll('.walk-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.walk-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentMaxMinutes = parseFloat(e.target.dataset.time);
          updateView();
        });
      });
    });
  </script>

</body>

</html>
